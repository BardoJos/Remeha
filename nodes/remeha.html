
<script type="text/javascript">
RED.nodes.registerType('remeha-home', {
    category: 'Remeha Home',
    color: '#e9a23b',
    defaults: {
        name: {
            value: "Remeha Home"
        },
        pollInterval: {
            value: 60,
            required: true,
            validate: RED.validators.number()
        },		
        clientId: {
            value: "6ce007c6-0628-419e-88f4-bee2e6418eec",
            required: true
        },
        baseLogin: {
            value: "https://remehalogin.bdrthermea.net",
            required: true
        },
        baseTenant: {
            value: "bdrb2cprod.onmicrosoft.com",
            required: true
        },

        baseApi: {
            value: "https://api.bdrthermea.net/Mobile/api",
            required: true
        },
        policy: {
            value: "B2C_1A_RPSignUpSignInNewRoomV3.1",
            required: true
        },
        redirectUri: {
            value: "com.b2c.remehaapp://login-callback",
            required: true
        },
        scope: {
            value: "https://bdrb2cprod.onmicrosoft.com/iotdevice/user_impersonation offline_access",
            required: true
        },
        subscriptionKey: {
            value: "df605c5470d846fc91e848b1cc653ddf",
            required: true
        }
    },
    credentials: {
        email: {
            type: "text",
            required: true
        },
        password: {
            type: "password",
            required: true
        },
        token: {
            type: "password"
        }
    },
    inputs: 1,
    outputs: 3,
    icon: "font-awesome/fa-thermometer-half",
    label: function() {
        return this.name || "Remeha Home";
    },
    paletteLabel: "Remeha Home",
    oneditprepare: function() {
        $("#node-input-pollInterval").typedInput({
            type: "num",
            types: ["num"]
        });
    }
});
</script>

<script type="text/html" data-template-name="remeha-home">
 
    <h3>Remeha account</h3>

    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> Name
        </label>
        <input type="text" id="node-input-name">
    </div>

    <div class="form-row">
        <label for="node-input-email">
            <i class="fa fa-user"></i> E-mail
        </label>
        <input type="text" id="node-input-email">
    </div>

    <div class="form-row">
        <label for="node-input-password">
            <i class="fa fa-lock"></i> Password
        </label>
        <input type="password" id="node-input-password">
    </div>

    <hr>
    <h3>Polling</h3>
	
    <div class="form-row">
        <label for="node-input-pollInterval">
            <i class="fa fa-clock-o"></i> Poll interval
        </label>
        <input type="text" id="node-input-pollInterval">
    </div>

    <p class="form-tips">
        The dashboard is retrieved automatically.
        The minimum polling interval is 30 seconds.
		Zero: polling is disabled
    </p>
	
	<hr>
    <h3>Configuratie</h3>
	
	<div class="form-row">
        <label for="node-input-clientId">
            <i class="fa fa-key"></i> Client ID
        </label>
        <input
            type="text" id="node-input-clientId"
            placeholder="Voer Remeha Client ID in"
        >
    </div>
	
    <div class="form-row">
        <label for="node-input-subscriptionKey">
            <i class="fa fa-key"></i> Subscription Key
        </label>
        <input type="text" id="node-input-subscriptionKey">
    </div>
	
    <div class="form-row">
        <label for="node-input-baseLogin">
            <i class="fa fa-sign-in"></i> Base Login
        </label>
        <input type="text" id="node-input-baseLogin">
    </div>
    <div class="form-row">
        <label for="node-input-baseTenant">
            <i class="fa fa-sign-in"></i> Base Tenant
        </label>
        <input type="text" id="node-input-baseTenant">
    </div>

    <div class="form-row">
        <label for="node-input-policy">
            <i class="fa fa-shield"></i> Policy
        </label>
        <input type="text" id="node-input-policy">
    </div>
	
    <div class="form-row">
        <label for="node-input-redirectUri">
            <i class="fa fa-external-link"></i> Redirect URI
        </label>
        <input type="text" id="node-input-redirectUri">
    </div>
	
	<div class="form-row">
        <label for="node-input-scope">
            <i class="fa fa-list"></i> Scope
        </label>
        <textarea
            id="node-input-scope"
            rows="3"
            style="width:70%; resize:vertical;"
        ></textarea>		
    </div>

    <div class="form-row">
        <label for="node-input-baseApi">
            <i class="fa fa-globe"></i> Base API
        </label>
        <input type="text" id="node-input-baseApi">
    </div>

</script>

<script type="text/html" data-help-name="remeha-home">

    <p>
        Connects Node-RED directly to Remeha Home.
    </p>

    <h3>Exists</h3>

    <ol>
        <li>Dashboard data</li>
		<li>Processed sensor data</li>
		<li>Task results and errors</li>
    </ol>

    <h3>Invoer</h3>

    <p>Use msg.payload-object.</p>

    <pre>
{
  "action": "manual",
  "zoneId": "123",
  "setpoint": 21
}
    </pre>

</script>
